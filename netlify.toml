[build]
  publish = "."
  # repo-only folders (tests, docs, generators) are removed before publish so the site never serves them
  command = "rm -rf tests docs resources_src"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
