:root{
  --bg:#050505; --frame:#0a0a0a; --card:#141414;
  --txt:#c8f5d8; --muted:#5a8a6e; --dim:#2a4a36;
  --green:#00ff88; --cyan:#00d4ff; --red:#ff3b3b; --amber:#ffcf4d;
  --violet:#b98cff; --orange:#ff9f45;
  --line:#c8f5d8; --line-soft:rgba(200,245,216,.25); --ink:#0a0a0a;
  --input:#0a0a0a; --track:#0f0f0f; --press:#1e1e1e; --scrim:rgba(0,0,0,.72);
}
/* tema claro — "papel" en vez de fósforo. acentos oscurecidos para contraste AA */
:root[data-theme="light"]{
  --bg:#e9e6df; --frame:#f6f4ef; --card:#fffdf8;
  --txt:#10251a; --muted:#4a6555; --dim:#c2cfc6;
  --green:#05803c; --cyan:#00607f; --red:#c1272d; --amber:#7a5200;
  --violet:#6234c0; --orange:#9c4a00;
  --line:#10251a; --line-soft:rgba(16,37,26,.20); --ink:#f6f4ef;
  --input:#ffffff; --track:#e2e0d8; --press:#eceae3; --scrim:rgba(16,37,26,.38);
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{background:var(--bg); color:var(--txt); font-family:'JetBrains Mono',ui-monospace,'SF Mono',Menlo,Consolas,monospace; display:flex; justify-content:center; min-height:100dvh}
.app{width:100%; max-width:480px; background:var(--frame); display:flex; flex-direction:column; min-height:100dvh; padding-top:calc(env(safe-area-inset-top) + 10px); position:relative; overflow:hidden}
.content{flex:1; display:flex; flex-direction:column}
input,select,textarea{font-family:inherit}
input:focus,select:focus,textarea:focus{outline:none; box-shadow:3px 3px 0 var(--green)}
.eyebrow{font-size:11px; letter-spacing:.12em; text-transform:uppercase; color:var(--muted)}
.mlabel{font-size:10px; letter-spacing:.12em; text-transform:uppercase; color:var(--muted); margin-bottom:6px}
.dot{color:var(--green)}
.mono-note{font-size:12px; color:var(--muted)}

/* inicio */
.home-head{padding:32px 24px 0; display:flex; justify-content:space-between; align-items:flex-start}
.home-h1{font-size:38px; font-weight:700; line-height:1; text-transform:lowercase; margin-top:10px; letter-spacing:-.02em}
.home-sub{font-size:13px; color:var(--muted); margin-top:10px}
.editbtn{cursor:pointer; font-size:11px; letter-spacing:.12em; text-transform:uppercase; padding:4px 8px; border:1.5px solid var(--muted); color:var(--muted)}
.editbtn.on{border-color:var(--green); color:var(--green)}
.mods{display:grid; grid-template-columns:1fr 1fr; gap:12px; padding:24px 20px}
.mod{border:1.5px solid var(--line); border-left:4px solid var(--acc,var(--line)); padding:14px; background:var(--card); position:relative; overflow:hidden; animation:modin .4s cubic-bezier(.2,.7,.3,1) both}
.mod::after{content:""; position:absolute; top:-34px; right:-34px; width:88px; height:88px; border-radius:50%; background:var(--acc,var(--green)); opacity:.08; filter:blur(12px); pointer-events:none}
.mod .mlabel{color:var(--acc,var(--muted))}
.mod.full{grid-column:1/-1}
.mod.tap{cursor:pointer}
.mod.tap:active{background:var(--press)}
.modgo{position:absolute; top:12px; right:13px; font-size:13px; line-height:1; color:var(--acc); opacity:.4; transition:opacity .15s, transform .15s}
.mod.tap:hover .modgo{opacity:1; transform:translateX(3px)}
@keyframes modin{from{opacity:0; transform:translateY(12px)}to{opacity:1; transform:none}}
.mod-ctrls{position:absolute; top:6px; right:6px; display:flex; gap:6px}
.mod-ctrls div{cursor:pointer; font-size:11px; padding:2px 6px; border:1.5px solid var(--muted); color:var(--muted)}
.mod-ctrls div.del{border-color:var(--red); color:var(--red)}
.big-num{font-size:40px; font-weight:700; line-height:1; color:var(--green)}
.big-num small{font-size:14px; color:var(--muted); font-weight:400}
.sq-row{display:flex; gap:4px; margin-top:10px}
.sq{width:10px; height:10px; animation:pop .34s cubic-bezier(.2,1.5,.4,1) both}
@keyframes pop{from{transform:scale(0)}to{transform:scale(1)}}
.vol-num{font-size:22px; font-weight:700; line-height:1.1}
.vol-num small{font-size:12px; color:var(--muted); font-weight:400}
.bars{display:flex; align-items:flex-end; gap:5px; height:34px; margin-top:10px}
.bars div{flex:1; transform-origin:bottom; animation:growy .5s cubic-bezier(.2,.8,.3,1) both}
@keyframes growy{from{transform:scaleY(0)}to{transform:scaleY(1)}}
.pr-row{display:flex; justify-content:space-between; align-items:baseline}
.pr-name{font-size:15px; font-weight:500; text-transform:lowercase}
.pr-val{font-size:17px; font-weight:700; color:var(--cyan)}
.pr-date{font-size:11px; color:var(--muted); margin-top:2px}
.rest-num{font-size:28px; font-weight:700; line-height:1.1}
.mnote{font-size:11px; color:var(--muted); margin-top:4px}
.acc-num{font-size:32px; font-weight:700; line-height:1; color:var(--acc)}
.acc-num small{font-size:13px; color:var(--muted); font-weight:400}
.wsub{font-size:11px; color:var(--muted); margin-top:6px}
.delta{font-weight:700}
.mrow{display:flex; align-items:center; gap:6px; margin-top:7px; font-size:10px; color:var(--muted); text-transform:lowercase}
.mrow .mn{width:52px; text-align:right; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.mrow .mt{flex:1; height:8px; background:var(--track); border:1.5px solid var(--dim)}
.mrow .mf{height:100%; background:var(--acc); transform-origin:left; animation:growx .6s cubic-bezier(.2,.8,.3,1) both}
@keyframes growx{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.impsum{display:flex; justify-content:space-between; align-items:baseline; gap:10px; font-size:11px; color:var(--muted); border-bottom:1.5px solid var(--dim); padding:7px 0}
.impsum b{font-size:12px; color:var(--txt); text-align:right}
.lvlbadge{display:inline-block; font-size:9.5px; letter-spacing:.06em; text-transform:uppercase; font-weight:700; background:var(--acc); color:var(--ink); padding:2px 6px; margin-top:8px}
.sparkdraw{stroke-dasharray:320; stroke-dashoffset:320; animation:draw .9s ease-out .1s forwards}
@keyframes draw{to{stroke-dashoffset:0}}
@media (prefers-reduced-motion: reduce){
  .mod,.sq,.bars div,.mrow .mf{animation:none}
  .sparkdraw{stroke-dashoffset:0; animation:none}
}
.demobar{display:flex; justify-content:space-between; align-items:center; gap:10px; margin:20px 20px -6px; padding:8px 10px; border:1.5px dashed var(--amber); color:var(--amber); font-size:11px}
.demobar b{cursor:pointer; white-space:nowrap; border-bottom:1.5px solid var(--amber)}
.addrow{grid-column:1/-1; display:flex; flex-wrap:wrap; gap:8px; align-items:center}
.addrow span{font-size:11px; color:var(--muted)}
.chip{cursor:pointer; font-size:11px; letter-spacing:.08em; text-transform:uppercase; border:1.5px dashed var(--muted); color:var(--muted); padding:4px 8px}
.home-foot{margin-top:auto; padding:0 20px 20px}
.btn-primary{cursor:pointer; background:var(--green); color:var(--ink); font-weight:700; font-size:17px; text-transform:lowercase; text-align:center; padding:18px; box-shadow:5px 5px 0 var(--line)}
.btn-primary:active{transform:translate(2px,2px); box-shadow:none}
.btn-done{border:1.5px solid var(--green); color:var(--green); font-weight:700; font-size:15px; text-transform:lowercase; text-align:center; padding:16px}

/* entreno */
.center-cta{flex:1; display:flex; flex-direction:column; justify-content:center; align-items:center; gap:20px; padding:24px; text-align:center}
.wk-head{padding:16px 20px; border-bottom:1.5px solid var(--line); display:flex; justify-content:space-between; align-items:center}
.wk-title{font-size:17px; font-weight:700; text-transform:lowercase}
.stopbtn{cursor:pointer; font-size:11px; letter-spacing:.1em; text-transform:uppercase; border:1.5px solid var(--red); color:var(--red); padding:4px 8px}
.ex-block{padding:20px; border-bottom:1.5px solid var(--line-soft)}
.ex-top{display:flex; justify-content:space-between; align-items:baseline; gap:8px}
.ex-name{font-size:16px; font-weight:700; text-transform:lowercase}
.ex-name small{font-weight:400; color:var(--muted); font-size:12px}
.ex-tools{display:flex; align-items:center; gap:10px; flex:0 0 auto}
.ex-last{font-size:12px; color:var(--cyan); white-space:nowrap}
.tool{cursor:pointer; font-size:11px; letter-spacing:.06em; text-transform:uppercase; color:var(--muted); border:1.5px solid var(--muted); padding:3px 6px}
.set-head,.set-row{display:grid; gap:8px; align-items:center}
.set-head{margin-top:14px; font-size:11px; letter-spacing:.1em; text-transform:uppercase; color:var(--muted)}
.set-row{margin-top:8px}
.set-n{font-size:14px; cursor:pointer; user-select:none; text-align:left}
.set-in{background:var(--input); padding:10px 8px; font-size:15px; text-align:center; width:100%; border-radius:0; border:1.5px solid var(--dim); color:var(--txt)}
.set-check{cursor:pointer; text-align:center; border:1.5px solid var(--line); padding:9px 0; font-size:15px}
.set-check:hover{background:var(--green); color:var(--ink); border-color:var(--green)}
.set-donemark{text-align:center; color:var(--green); font-size:18px; font-weight:700}
.actrow{display:flex; gap:10px; margin-top:14px}
.actbtn{flex:1; cursor:pointer; text-align:center; font-size:12.5px; font-weight:700; letter-spacing:.04em; text-transform:lowercase; padding:11px 8px; border:1.5px solid var(--acc); color:var(--acc); background:transparent; box-shadow:3px 3px 0 var(--dim); transition:background .14s, color .14s, box-shadow .1s, transform .1s}

function seedHistory(db){
  const baseW={ "press banca":80,"press militar":45,"press inclinado mancuerna":28,"elevaciones laterales":10,"fondos":0,"aperturas polea":18,
    "dominadas":0,"remo con barra":55,"face pull":20,"curl bíceps":14,"sentadilla":100,"peso muerto":120,"prensa":140,"curl femoral":35,"zancadas":22,"plancha":0 };
  const today=new Date(); today.setHours(12,0,0,0);
  for(let back=42; back>=1; back--){
    const d=new Date(today); d.setDate(today.getDate()-back);
    const wd=d.getDay(); const plan=db.routine[wd]; if(!plan||!plan.length) continue;
    const wk=Math.floor((42-back)/7);
    const k=dateKey(d); const exs=[];
    plan.forEach(r=>{ const ex=db.exercises.find(e=>e.id===r.exId); if(!ex) return;
      const big=/sentad|banca|peso muerto/.test(ex.name); const bw=baseW[ex.name]||0;
      const w=bw>0? bw+(big?wk*2.5:0) : 0;
      const sets=[]; for(let i=0;i<r.sets;i++) sets.push({kg:w?String(w):"", reps:String(r.reps), done:true, type:"work", rpe:""});
      exs.push({exId:ex.id,name:ex.name,muscle:ex.muscle,sets});
    });
    db.sessions[k]={label:db.labels[wd], exercises:exs, finished:true, note:""};
  }
  let w=82; for(let back=42; back>=6; back-=6){ const d=new Date(today); d.setDate(today.getDate()-back); db.bodyweight.push({date:dateKey(d),weight:Math.round(w*10)/10}); w-=0.35; }
}

  return `<div class="content">
    <div class="home-head"><div>

    <div class="mods">${DB.settings.modOrder.map(mod).join("")}${hidden}</div>
    <div class="home-foot">${foot}</div>

  if(!ex){ return `<div class="content"><div class="center-cta"><div class="mono-note">// entreno libre — sin ejercicios aún</div>

  </div>`;

function screenHistorial(){
  const now=new Date(); const y=now.getFullYear(),mo=now.getMonth();
  const first=new Date(y,mo,1); const lead=(first.getDay()+6)%7; const days=new Date(y,mo+1,0).getDate();
  const fin=new Set(finishedDates()); const prs=prDatesSet();
  let cells=""; for(let i=0;i<lead;i++) cells+=`<div class="cal-cell"></div>`;
  for(let d=1;d<=days;d++){ const k=dateKey(new Date(y,mo,d)); let bg="var(--card)",bd="none";
    if(k===todayKey()){ if(fin.has(k)) bg="var(--green)"; else{ bg="transparent"; bd="1.5px solid var(--green)"; } }
    else if(prs.has(k)) bg="var(--cyan)"; else if(fin.has(k)) bg="var(--green)";
    cells+=`<div class="cal-cell" style="background:${bg};border:${bd}"></div>`; }
  const list=finishedDates().sort().reverse().map(k=>{ const s=DB.sessions[k]; const dt=new Date(k+"T12:00:00"); const nEx=s.exercises.filter(e=>e.sets.some(x=>x.done)).length; const vol=Math.round(conv(sessionVol(k))).toLocaleString("en-US"); const tag=prs.has(k)?`<span class="sess-tag">■ pr</span>`:"";
    return `<div class="sess" onclick="A.shareSession('${k}')"><div><div class="sess-title">${DOW[dt.getDay()]} ${dt.getDate()} · ${esc(s.label)} ${tag}</div><div class="sess-spec">${nEx} ejercicios · ${vol} ${U()}</div></div><span style="color:var(--muted)">↗</span></div>`; }).join("")||`<div class="sess"><div class="sess-spec">// sin entrenos aún</div></div>`;

function screenProgreso(){
  const bw=curBW(); const lifts=BIG3.map(b=>({b,d:bigLift(b.re)}));
  const total=Math.round(lifts.reduce((s,x)=>s+x.d.e1,0));
  const tlvl=bw?slevel(total/bw,[2.75,3.75,5.25,7.25]):null;
  const maxClub=Math.max(...lifts.map(x=>plateClub(x.d.w)),0);
  const b3rows=lifts.map(x=>{ const lvl=bw?slevel(x.d.e1/bw,x.b.thr):null; const club=plateClub(x.d.w); return `<div class="b3row"><span class="b3name">${x.b.label}</span>${club>=1?`<span class="club">${club} pl</span>`:""}${lvl!=null?`<span class="b3lvl">${LVL[lvl]}</span>`:""}<span class="b3w">${x.d.e1?conv(x.d.e1):"—"}</span></div>`; }).join("");
  let chartEx=DB.exercises.find(e=>/banca/i.test(e.name));
  if(!chartEx||sparkPts(chartEx.id).length<2){ const cand=DB.exercises.map(e=>({e,n:sparkPts(e.id).length})).sort((a,b)=>b.n-a.n)[0]; chartEx=cand?cand.e:null; }
  const pts=chartEx?sparkPts(chartEx.id):[]; const oneRm=pts.length?conv(pts[pts.length-1]):0; const gain=pts.length>1?Math.round(conv(pts[pts.length-1])-conv(pts[0])):0;
  const prList=DB.exercises.map(e=>{ let best=0,info=null; Object.keys(DB.sessions).forEach(k=>{ const ex=DB.sessions[k].exercises.find(x=>x.exId===e.id); if(!ex)return; ex.sets.forEach(s=>{ if(s.done){ const v=est1rm(s); if(v>best){best=v;info={kg:s.kg,reps:s.reps,date:k};} } }); }); return info?{name:e.name,val:`${conv(num(info.kg))} ${U()} × ${info.reps}`,date:MES[new Date(info.date+"T12:00:00").getMonth()],e1:best}:null; }).filter(Boolean).sort((a,b)=>b.e1-a.e1).slice(0,5);

    ${chartEx&&pts.length>1?`<div class="prog-block"><div class="prog-row"><div class="prog-name">${esc(chartEx.name)} — 1rm est.</div></div><div class="prog-val">${oneRm} ${U()} <small>${gain>=0?"+":""}${gain} histórico</small></div>${sparkSVG(pts.map(conv),"#00ff88")}</div>`:""}
    <div class="section-lbl">récords personales</div>
    ${prList.map(p=>`<div class="prs-item"><span class="name">${esc(p.name)}</span><span class="val">${esc(p.val)} <span class="date" style="color:var(--cyan)">${p.date}</span></span></div>`).join("")||`<div class="prs-item"><span class="name">// sin récords aún</span></div>`}
    <div class="section-lbl">peso corporal</div>
    <div class="prog-block">${bwArr.length?`<div class="prog-val" style="font-size:22px">${bwArr[bwArr.length-1].weight} ${U()} <small>${bwArr.length>1?((bwArr[bwArr.length-1].weight-bwArr[0].weight>=0?"+":"")+(Math.round((bwArr[bwArr.length-1].weight-bwArr[0].weight)*10)/10)):""} total</small></div>${sparkSVG(bwArr.map(x=>x.weight),"#00d4ff")}`:`<div class="mono-note">// sin registros</div>`}<div class="mbtn green" style="margin-top:12px" onclick="A.openBodyweight()">+ registrar peso</div></div>
    <div class="section-lbl">volumen por músculo · 30d</div>
    ${md.map(m=>`<div class="mbar"><div class="ml">${m[0].toLowerCase()}</div><div class="mt"><div class="mf" style="width:${Math.max(4,m[1]/mmax*100)}%"></div></div><div class="mv">${Math.round(conv(m[1]))}</div></div>`).join("")||`<div class="mono-note" style="padding:6px 20px">// sin volumen en 30 días</div>`}

function countUp(){
  if(window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  document.querySelectorAll(".cnum").forEach(el=>{
    const to=parseFloat(el.dataset.v)||0, dec=parseInt(el.dataset.dec)||0, loc=el.dataset.loc==="1";
    const out=v=>{ const n=v.toFixed(dec); return loc?Number(n).toLocaleString("en-US"):n; };
    const t0=performance.now();
    (function step(t){ const p=Math.min(1,(t-t0)/620); el.textContent=out(to*(1-Math.pow(1-p,3))); if(p<1) requestAnimationFrame(step); })(t0);
  });
}

/* ==================== IMPORTAR RUTINA DE PDF ==================== */
const DAY_RE={0:/^(domingo|dom)\b/i,1:/^(lunes|lun)\b/i,2:/^(martes|mar)\b/i,3:/^(mi[eé]rcoles|mi[eé]r)\b/i,4:/^(jueves|jue)\b/i,5:/^(viernes|vie)\b/i,6:/^(s[aá]bado|s[aá]b)\b/i};
const GENERIC_DAY_RE=/^(d[ií]a|day|entreno|sesi[oó]n)\s*#?\s*\d+\b/i;
const LABEL_RE=/\b(push|pull|legs|empuje|jal[oó]n|jalon|pierna|superior|inferior|full\s*body|upper|lower|torso|pecho|espalda|hombro|gl[uú]teo|brazo)\b/i;
const EQUIP_RE=/\b(mancuerna|barra|polea|m[aá]quina|cable|banco|smith|kettlebell|goblet)\b/i;
const EX_LINE_RE=/^([A-Za-zÀ-ÖØ-öø-ÿ0-9()/'’.\- ]{3,60}?)[\s:.\-–]+(\d{1,2})\s*(?:series?|sets?)?\s*(?:de\s*|[x×]\s*)(\d{1,3})(?:\s*[-–]\s*\d{1,3})?\s*(?:reps?|repeticiones?)?/i;
const EX_NAME_ONLY_RE=/^[A-Za-zÀ-ÖØ-öø-ÿ][A-Za-zÀ-ÖØ-öø-ÿ0-9()/'’.\- ]{2,58}$/;
function stripBullet(s){ return s.replace(/^[•*\u2022]\s+/,"").replace(/^\d+[.)]\s+/,"").trim(); }
function parseRoutineText(lines){
  const labels={0:"descanso",1:"descanso",2:"descanso",3:"descanso",4:"descanso",5:"descanso",6:"descanso"};
  const days={0:[],1:[],2:[],3:[],4:[],5:[],6:[]};
  const order=[1,2,3,4,5,6,0]; let usedGeneric=0; let curDay=null;
  lines.forEach(raw=>{
    const line=stripBullet(String(raw||"").trim()); if(!line) return;
    let matched=null;
    for(const k in DAY_RE){ if(DAY_RE[k].test(line)){ matched=+k; break; } }
    if(matched===null && GENERIC_DAY_RE.test(line)){ matched=order[usedGeneric%order.length]; usedGeneric++; }
    if(matched===null && line.length<=32 && !EX_LINE_RE.test(line) && !EQUIP_RE.test(line) && LABEL_RE.test(line) && !/\d{2,}/.test(line)){
      matched=order[usedGeneric%order.length]; usedGeneric++;
    }
    if(matched!==null){
      curDay=matched;
      const lbl=line.replace(/^(lunes|martes|mi[eé]rcoles|jueves|viernes|s[aá]bado|domingo|d[ií]a|day|entreno|sesi[oó]n)\s*#?\d*[:\-–.]?\s*/i,"").trim();
      labels[curDay]=(lbl||line).slice(0,28);
      return;
    }
    if(curDay===null) curDay=1;
    const m=EX_LINE_RE.exec(line);
    if(m){
      const name=m[1].trim().replace(/\s+/g," ");
      const sets=Math.min(10,parseInt(m[2],10)); const reps=Math.min(100,parseInt(m[3],10));
      if(name && sets>0 && reps>0) days[curDay].push([name,sets,reps]);
    } else if(EX_NAME_ONLY_RE.test(line) && !/\d{2,}/.test(line)){
      days[curDay].push([line,3,10]);
    }
  });
  [0,1,2,3,4,5,6].forEach(d=>{ if(days[d].length && labels[d]==="descanso") labels[d]="entreno"; });
  return {labels,days};
}
let _importDraft=null;
function openPdfImport(){
  openSheet(`<h3>importar rutina de pdf</h3><div class="mono-note" style="margin-bottom:10px">// sube el pdf de tu rutina — la app intenta detectar días y ejercicios. podrás revisar y corregir antes de guardar.</div><div class="field"><input type="file" accept="application/pdf,.pdf" onchange="impPdfFile(event)"></div><div class="btnrow"><div class="mbtn" onclick="openPresets()">cancelar</div></div>`);
}
window.openPdfImport=openPdfImport;
window.impPdfFile=async ev=>{
  const f=ev.target.files[0]; if(!f) return;
  if(!window.extractPdfText){ toast("el lector de pdf no cargó — revisa tu conexión e inténtalo de nuevo"); return; }
  openSheet(`<h3>leyendo pdf…</h3><div class="mono-note">// esto toma unos segundos</div>`);
  try{
    const lines=await window.extractPdfText(f);
    const parsed=parseRoutineText(lines);
    const total=[0,1,2,3,4,5,6].reduce((s,i)=>s+(parsed.days[i]||[]).length,0);
    if(!total){ openSheet(`<h3>no se detectaron ejercicios</h3><div class="mono-note" style="margin-bottom:12px">// el formato del pdf no se pudo interpretar. prueba otro archivo o agrega los ejercicios a mano.</div><div class="btnrow"><div class="mbtn" onclick="openPresets()">volver</div></div>`); return; }
    _importDraft={name:f.name.replace(/\.pdf$/i,"").trim().slice(0,40)||"rutina importada", labels:parsed.labels, days:parsed.days};
    openImportReview();
  }catch(e){
    openSheet(`<h3>no se pudo leer el pdf</h3><div class="mono-note" style="margin-bottom:12px">// intenta con otro archivo.</div><div class="btnrow"><div class="mbtn" onclick="openPresets()">volver</div></div>`);
  }
};
function openImportReview(){
  if(!_importDraft) return; const d=_importDraft;
  const blocks=[1,2,3,4,5,6,0].map(di=>{
    const items=d.days[di]||[]; if(!items.length) return "";
    const rows=items.map((it,idx)=>`<div class="ritem"><div><div class="rn">${esc(it[0])}</div><div class="rm">${it[1]} × ${it[2]}</div></div><div class="rc"><div class="del" onclick="delImportItem(${di},${idx})">×</div></div></div>`).join("");
    return `<div class="mono-note" style="margin:12px 0 4px">${DOW[di]} · ${esc(d.labels[di]||"")}</div>${rows}`;
  }).join("");
  openSheet(`<h3>revisar plantilla importada</h3><div class="mono-note" style="margin-bottom:10px">// borra lo que no aplique antes de guardar. lo demás lo puedes ajustar después, como cualquier plantilla.</div><div class="field"><label>nombre de la plantilla</label><input id="impName" value="${esc(d.name)}"></div><div class="list" style="max-height:40vh">${blocks}</div><div class="btnrow" style="margin-top:14px"><div class="mbtn" onclick="openPresets()">cancelar</div><div class="mbtn green" onclick="saveImportedPreset()">guardar como plantilla</div></div>`);
}
window.delImportItem=(di,idx)=>{ if(!_importDraft) return; _importDraft.days[di].splice(idx,1); openImportReview(); };
window.saveImportedPreset=()=>{
  if(!_importDraft) return;
  const nameInput=document.getElementById("impName"); const name=(nameInput?nameInput.value:"").trim()||_importDraft.name;
  const total=[0,1,2,3,4,5,6].reduce((s,i)=>s+(_importDraft.days[i]||[]).length,0);
  if(!total){ toast("no quedan ejercicios para guardar"); return; }
  if(!DB.customPresets) DB.customPresets={};
  DB.customPresets[name]={labels:Object.assign({},_importDraft.labels), days:JSON.parse(JSON.stringify(_importDraft.days)), note:"importada de pdf"};
  save(); _importDraft=null; closeSheet(); openPresets(); toast("plantilla guardada");
};

function openBodyweight(){ const ex=DB.bodyweight.find(b=>b.date===todayKey()); openSheet(`<h3>peso corporal</h3><div class="field"><label>peso hoy (${U()})</label><input id="bw" inputmode="decimal" value="${ex?ex.weight:""}" placeholder="ej. 78.5"></div><div class="btnrow"><div class="mbtn" onclick="closeSheet()">cancelar</div><div class="mbtn green" onclick="saveBw()">guardar</div></div>`); setTimeout(()=>document.getElementById("bw").focus(),80); }
window.openBodyweight=openBodyweight;
window.saveBw=()=>{ const w=num(document.getElementById("bw").value); if(!w){toast("peso inválido");return;} const k=todayKey(); const e=DB.bodyweight.find(b=>b.date===k); if(e)e.weight=w; else DB.bodyweight.push({date:k,weight:w}); save(); closeSheet(); render(); toast("peso guardado"); };

function openPlate(prefill){ const bar=U()==="kg"?DB.settings.barKg:DB.settings.barLb; openSheet(`<h3>calculadora de discos</h3><div class="field two"><div><label>objetivo (${U()})</label><input id="pt" inputmode="decimal" value="${prefill||""}" oninput="calcPlate()"></div><div><label>barra (${U()})</label><input id="pb" inputmode="decimal" value="${bar}" oninput="calcPlate()"></div></div><div id="pv" class="bbell"></div><div id="px" class="ptxt"></div>`); setTimeout(calcPlate,30); }
window.openPlate=openPlate;
function loadedBarHTML(used){ const cell=p=>{const i=plateInfo(p);return `<div class="pl" style="background:${i[0]};color:${i[1]};height:${i[2]}px">${p}</div>`;}; return `<div style="display:flex;align-items:center"><div class="collar"></div>${used.slice().reverse().map(cell).join("")}<div class="sleeve"></div><div class="shaft"></div><div class="sleeve"></div>${used.map(cell).join("")}<div class="collar"></div></div>`; }
window.calcPlate=()=>{ const t=num(document.getElementById("pt").value),bar=num(document.getElementById("pb").value); DB.settings[U()==="kg"?"barKg":"barLb"]=bar; save(); const pv=document.getElementById("pv"),px=document.getElementById("px"); const P=U()==="kg"?[25,20,15,10,5,2.5,1.25]:[45,35,25,10,5,2.5]; let per=(t-bar)/2; if(t<=0){pv.innerHTML="";px.textContent="ingresa un objetivo.";return;} if(per<0){pv.innerHTML="";px.textContent="objetivo menor que la barra.";return;} let rem=per,u=[]; P.forEach(p=>{ while(rem>=p-1e-9){u.push(p);rem=Math.round((rem-p)*100)/100;} }); pv.innerHTML=u.length?loadedBarHTML(u):`<div style="display:flex;align-items:center"><div class="collar"></div><div class="sleeve"></div><div class="shaft"></div><div class="sleeve"></div><div class="collar"></div></div>`; px.innerHTML=`<b>${u.length?u.join(" + "):"solo barra"}</b> por lado`; };

function daysSinceExport(){ const le=DB.settings.lastExport; if(!le) return null; return Math.floor((new Date(todayKey()+"T12:00:00")-new Date(le+"T12:00:00"))/864e5); }
function backupNote(){ const d=daysSinceExport();
  if(d===null) return `<div class="foot-note" style="color:var(--amber)">// nunca has exportado. si borras los datos del navegador, pierdes todo.</div>`;
  if(d>=14) return `<div class="foot-note" style="color:var(--amber)">// última copia hace ${d} días. conviene exportar de nuevo.</div>`;
  return `<div class="foot-note">// última copia: ${d===0?"hoy":d===1?"ayer":"hace "+d+" días"}.</div>`;
}
function exportData(){ DB.settings.lastExport=todayKey(); save(); const data=JSON.stringify(DB,null,2); try{ const b=new Blob([data],{type:"application/json"}); const u=URL.createObjectURL(b); const a=document.createElement("a"); a.href=u; a.download="gymtracker-"+todayKey()+".json"; a.click(); setTimeout(()=>URL.revokeObjectURL(u),1000);}catch(e){} if(navigator.clipboard) navigator.clipboard.writeText(data).then(()=>toast("exportado + copiado")).catch(()=>toast("exportado")); else toast("exportado"); }
window.exportData=exportData;
function openImport(){ openSheet(`<h3>importar datos</h3><div class="mono-note" style="margin-bottom:10px">// reemplaza todo. archivo o pega json.</div><div class="field"><input type="file" accept="application/json,.json" onchange="impFile(event)"></div><div class="field"><label>o pega aquí</label><textarea id="imt" style="min-height:80px"></textarea></div><div class="btnrow"><div class="mbtn" onclick="closeSheet()">cancelar</div><div class="mbtn green" onclick="impText()">importar</div></div>`); }
window.openImport=openImport;
window.impText=()=>{ const t=document.getElementById("imt").value.trim(); if(!t){toast("nada que importar");return;} applyImport(t); };
window.impFile=ev=>{ const f=ev.target.files[0]; if(!f)return; const r=new FileReader(); r.onload=()=>applyImport(r.result); r.readAsText(f); };
function applyImport(t){
  let d; try{ d=JSON.parse(t); }catch(e){ toast("json inválido"); return; }
  if(!d||!d.exercises||!d.sessions){ toast("json inválido"); return; }
  window._imp=d;
  const ns=Object.keys(d.sessions).length, ne=d.exercises.length, nb=(d.bodyweight||[]).length, cs=Object.keys(DB.sessions).length;
  openSheet(`<h3>¿importar?</h3><div class="mono-note" style="margin-bottom:12px">// esto reemplaza TODOS tus datos actuales.</div>
    <div class="impsum"><span>entra</span><b>${ns} sesiones · ${ne} ejercicios · ${nb} pesos</b></div>
    <div class="impsum"><span>se borra</span><b style="color:var(--red)">${cs} sesiones actuales</b></div>
    <div class="btnrow" style="margin-top:14px"><div class="mbtn" onclick="closeSheet()">cancelar</div><div class="mbtn red" onclick="commitImport()">sí, reemplazar</div></div>`);
}
window.commitImport=()=>{ const d=window._imp; if(!d) return; localStorage.setItem(KEY,JSON.stringify(d)); DB=load(); window._imp=null; closeSheet(); render(); toast("datos importados"); };
window.doWipe=()=>{ localStorage.removeItem(KEY); DB=seedAll(baseDefault()); DB.tab="inicio"; save(); closeSheet(); render(); openWelcome(); };

function showPR(name,s){ window._pr={kind:"pr",name,weight:num(s.kg),reps:parseInt(s.reps)||0,e1:Math.round(est1rm(s))}; document.getElementById("prLift").textContent=name; document.getElementById("prWeight").innerHTML=`${num(s.kg)}<small>${U()}</small>`; document.getElementById("prSub").textContent=`${parseInt(s.reps)||0} reps · 1rm est. ${Math.round(est1rm(s))}${U()}`; document.getElementById("prOverlay").classList.add("show"); burst(); }
function burst(){ const box=document.getElementById("prRays"); box.innerHTML=""; const cols=["#00ff88","#00d4ff","#e23b46","#f5c518","#ffffff"]; for(let i=0;i<26;i++){ const s=document.createElement("span"); s.className="confetti"; s.style.background=cols[i%cols.length]; const a=Math.random()*6.283,d=100+Math.random()*220; s.style.setProperty("--dx",(Math.cos(a)*d).toFixed(0)+"px"); s.style.setProperty("--dy",(Math.sin(a)*d).toFixed(0)+"px"); s.style.animationDelay=(Math.random()*.12).toFixed(2)+"s"; box.appendChild(s); } }

function big3ShareData(){ const bw=curBW(); const lifts=BIG3.map(b=>({label:b.label,d:bigLift(b.re),thr:b.thr})); const total=Math.round(lifts.reduce((s,x)=>s+x.d.e1,0)); const tlvl=bw?slevel(total/bw,[2.75,3.75,5.25,7.25]):null; return {kind:"big3",lifts:lifts.map(x=>({label:x.label,val:x.d.e1?conv(x.d.e1):0,lvl:bw&&x.d.e1?LVL[slevel(x.d.e1/bw,x.thr)]:""})),total:conv(total),level:tlvl!=null?LVL[tlvl]:"",shareText:`mi big 3: ${conv(total)}${U()} total. #gymtracker`}; }
function openShareSession(k){ const s=DB.sessions[k]; if(!s)return; let vol=0; const rows=[]; s.exercises.forEach(ex=>{ const done=ex.sets.filter(t=>t.done); if(!done.length)return; done.forEach(t=>vol+=num(t.kg)*(parseInt(t.reps)||0)); rows.push({name:ex.name,sets:done.map(t=>`${t.kg||0}x${t.reps||0}`).join("  ")}); }); const dt=new Date(k+"T12:00:00"); openShareSheet("session",{kind:"session",date:`${DOW[dt.getDay()]} ${dt.getDate()} ${MES[dt.getMonth()]} · ${s.label}`,rows,volume:Math.round(conv(vol)),shareText:`entreno: ${Math.round(conv(vol))}${U()} de volumen. #gymtracker`}); }
window.openShareSession=openShareSession;
async function openShareSheet(kind,data){ openSheet(`<h3>compartir</h3><img id="shimg" class="share-img" alt="tarjeta"><div class="btnrow"><div class="mbtn" onclick="closeSheet()">cerrar</div><div class="mbtn green" id="shgo">↗ compartir / guardar</div></div>`); try{ await document.fonts.load("700 40px 'JetBrains Mono'"); }catch(e){} const cv=document.createElement("canvas"); cv.width=1080; cv.height=1350; drawCard(cv.getContext("2d"),1080,1350,kind,data); const url=cv.toDataURL("image/png"); const im=document.getElementById("shimg"); if(im) im.src=url; const go=document.getElementById("shgo"); if(go) go.onclick=()=>shareImg(url,"gymtracker.png",data.shareText||"gymtracker"); }
window.openShareSheet=openShareSheet;
async function shareImg(url,fn,text){ try{ const b=await(await fetch(url)).blob(); const f=new File([b],fn,{type:"image/png"}); if(navigator.canShare&&navigator.canShare({files:[f]})){ await navigator.share({files:[f],text}); return; } }catch(e){} const a=document.createElement("a"); a.href=url; a.download=fn; a.click(); toast("imagen guardada"); }
function drawBar(ctx,cx,cy,used){ const pw=42,gap=6,sw=30,cw=18,sh=120; ctx.fillStyle="#9aa4a9"; ctx.fillRect(cx-sh/2,cy-8,sh,16); [1,-1].forEach(dir=>{ let x=cx+dir*sh/2; ctx.fillStyle="#7f888d"; ctx.fillRect(dir>0?x:x-sw,cy-14,sw,28); x+=dir*sw; used.forEach(p=>{ const info=plateInfo(p),hh=info[2]*2.2,px=dir>0?x:x-pw; ctx.fillStyle=info[0]; ctx.fillRect(px,cy-hh/2,pw,hh); ctx.strokeStyle="rgba(0,0,0,.5)"; ctx.lineWidth=2; ctx.strokeRect(px,cy-hh/2,pw,hh); ctx.fillStyle=info[1]; ctx.font="700 18px 'JetBrains Mono'"; ctx.textAlign="center"; ctx.textBaseline="middle"; ctx.fillText(String(p),px+pw/2,cy); x+=dir*(pw+gap); }); ctx.fillStyle="#7f888d"; ctx.fillRect(dir>0?x:x-cw,cy-22,cw,44); }); ctx.textAlign="left"; ctx.textBaseline="alphabetic"; }
function drawCard(ctx,W,H,kind,data){ ctx.fillStyle="#050505"; ctx.fillRect(0,0,W,H); ctx.fillStyle="#00ff88"; ctx.fillRect(0,0,16,H); ctx.textBaseline="alphabetic"; ctx.textAlign="left"; ctx.font="700 46px 'JetBrains Mono'"; ctx.fillStyle="#c8f5d8"; ctx.fillText("gym",64,112); const gw=ctx.measureText("gym").width; ctx.fillStyle="#00ff88"; ctx.fillText(".tracker",64+gw,112);
  ctx.textAlign="center";
  if(kind==="pr"){ ctx.font="500 30px 'JetBrains Mono'"; ctx.fillStyle="#00d4ff"; ctx.fillText("nuevo récord",W/2,320); ctx.font="700 64px 'JetBrains Mono'"; ctx.fillStyle="#c8f5d8"; ctx.fillText(data.name,W/2,410); ctx.font="700 220px 'JetBrains Mono'"; ctx.fillStyle="#00ff88"; ctx.fillText(String(data.weight),W/2,690); ctx.font="500 54px 'JetBrains Mono'"; ctx.fillStyle="#5a8a6e"; ctx.fillText(U(),W/2,760); ctx.font="500 32px 'JetBrains Mono'"; ctx.fillStyle="#5a8a6e"; ctx.fillText(`${data.reps} reps · 1rm est. ${data.e1}${U()}`,W/2,840); drawBar(ctx,W/2,1070,platesFor(data.weight)); }
  else if(kind==="big3"){ ctx.textAlign="left"; ctx.font="500 30px 'JetBrains Mono'"; ctx.fillStyle="#00d4ff"; ctx.fillText("big 3 · fuerza",64,300); let y=420; data.lifts.forEach(l=>{ ctx.textAlign="left"; ctx.font="500 44px 'JetBrains Mono'"; ctx.fillStyle="#c8f5d8"; ctx.fillText(l.label,64,y); if(l.lvl){ctx.font="400 22px 'JetBrains Mono'";ctx.fillStyle="#5a8a6e";ctx.fillText(l.lvl,64,y+34);} ctx.textAlign="right"; ctx.font="700 56px 'JetBrains Mono'"; ctx.fillStyle="#00ff88"; ctx.fillText((l.val||"—")+U(),W-64,y+6); y+=150; }); ctx.strokeStyle="#2a4a36"; ctx.beginPath(); ctx.moveTo(64,y-70); ctx.lineTo(W-64,y-70); ctx.stroke(); ctx.textAlign="center"; ctx.font="500 32px 'JetBrains Mono'"; ctx.fillStyle="#5a8a6e"; ctx.fillText("total 1rm estimado",W/2,y+10); ctx.font="700 190px 'JetBrains Mono'"; ctx.fillStyle="#00ff88"; ctx.fillText(String(data.total),W/2,y+220); ctx.font="500 48px 'JetBrains Mono'"; ctx.fillStyle="#5a8a6e"; ctx.fillText(U(),W/2,y+284); if(data.level){ctx.font="700 40px 'JetBrains Mono'";const tw=ctx.measureText(data.level).width;ctx.fillStyle="#00ff88";ctx.fillRect(W/2-tw/2-24,y+330,tw+48,62);ctx.fillStyle="#050505";ctx.fillText(data.level,W/2,y+372);} }
  else if(kind==="session"){ ctx.textAlign="left"; ctx.font="500 30px 'JetBrains Mono'"; ctx.fillStyle="#00d4ff"; ctx.fillText(data.date,64,300); let y=400; data.rows.slice(0,7).forEach(r=>{ ctx.textAlign="left"; ctx.font="500 40px 'JetBrains Mono'"; ctx.fillStyle="#c8f5d8"; ctx.fillText(r.name,64,y); ctx.textAlign="right"; ctx.font="400 28px 'JetBrains Mono'"; ctx.fillStyle="#5a8a6e"; ctx.fillText(r.sets,W-64,y); y+=84; }); ctx.textAlign="left"; ctx.font="500 32px 'JetBrains Mono'"; ctx.fillStyle="#5a8a6e"; ctx.fillText("volumen total",64,H-210); ctx.font="700 140px 'JetBrains Mono'"; ctx.fillStyle="#00ff88"; ctx.fillText(String(data.volume),64,H-90); ctx.font="500 40px 'JetBrains Mono'"; ctx.fillStyle="#5a8a6e"; ctx.fillText(U(),64+ctx.measureText(String(data.volume)).width+16,H-90); }
  ctx.textAlign="center"; ctx.font="400 24px 'JetBrains Mono'"; ctx.fillStyle="#3a5a48"; ctx.fillText("// registra. supera. repite.",W/2,H-42); ctx.textAlign="left";
}

const mqLight=(()=>{ try{ return matchMedia("(prefers-color-scheme: light)"); }catch(e){ return null; } })();
function resolveTheme(){ const t=(DB.settings.theme)||"auto"; if(t==="light"||t==="dark") return t; return (mqLight&&mqLight.matches)?"light":"dark"; }
function applyTheme(){ const r=resolveTheme();
  document.documentElement.dataset.theme=r;
  const m=document.querySelector('meta[name="theme-color"]'); if(m) m.setAttribute("content", r==="light"?"#f6f4ef":"#050505");
}
if(mqLight){ const onSys=()=>{ if(((DB.settings.theme)||"auto")==="auto") applyTheme(); };
  try{ mqLight.addEventListener("change",onSys); }catch(e){ try{ mqLight.addListener(onSys); }catch(e2){} } }

/* ==================== TIMER + INIT ==================== */
let _ac=null;
function audio(){ try{ const C=window.AudioContext||window.webkitAudioContext; if(!C) return null; if(!_ac) _ac=new C(); if(_ac.state==="suspended") _ac.resume(); return _ac; }catch(e){ return null; } }
function beep(){ const ac=audio(); if(!ac) return; try{ const t0=ac.currentTime;
  [[0,880],[.19,1320]].forEach(([off,hz])=>{ const o=ac.createOscillator(),g=ac.createGain(); o.type="square"; o.frequency.value=hz;
    g.gain.setValueAtTime(.0001,t0+off); g.gain.exponentialRampToValueAtTime(.16,t0+off+.012); g.gain.exponentialRampToValueAtTime(.0001,t0+off+.15);
    o.connect(g); g.connect(ac.destination); o.start(t0+off); o.stop(t0+off+.17); });
}catch(e){} }
function restDone(){ if(DB.settings.sound) beep(); vibrate([90,60,90]); toast("descanso terminado"); }
setInterval(()=>{ if(!DB.run.active&&!DB.run.resting) return; if(DB.run.active) DB.run.elapsed++; if(DB.run.resting){ if(DB.run.rest>0) DB.run.rest--; if(DB.run.rest<=0){ DB.run.resting=false; restDone(); } } save(); if(DB.tab==="entreno"&&DB.run.active){ const el=document.getElementById("elapsed"); if(el) el.textContent=fmt(DB.run.elapsed); const rf=document.getElementById("restfmt"); if(rf){ rf.textContent=fmt(DB.run.rest); rf.style.color=DB.run.resting?"var(--green)":"var(--muted)"; } } },1000);

applyTheme();
render();
if(!DB.settings.onboarded) openWelcome();
if("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(()=>{});
</script>
<script type="module">
import * as pdfjsLib from "./pdfjs/pdf.min.mjs";
pdfjsLib.GlobalWorkerOptions.workerSrc = "./pdfjs/pdf.worker.min.mjs";
window.extractPdfText = async function(file){
  const buf = await file.arrayBuffer();
  const pdf = await pdfjsLib.getDocument({ data: buf }).promise;
  const lines = [];
  for(let p=1; p<=pdf.numPages; p++){
    const page = await pdf.getPage(p);
    const content = await page.getTextContent();
    const items = content.items.slice().sort((a,b)=> b.transform[5]-a.transform[5] || a.transform[4]-b.transform[4]);
    let curY=null, line=[];
    items.forEach(it=>{
      const y = Math.round(it.transform[5]);
      if(curY===null || Math.abs(y-curY)>3){
        if(line.length) lines.push(line.join(" ").replace(/\s+/g," ").trim());
        line=[it.str]; curY=y;
      } else {
        line.push(it.str);
      }
    });
    if(line.length) lines.push(line.join(" ").replace(/\s+/g," ").trim());
  }
  return lines.filter(Boolean);
};
</script>
