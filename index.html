  :root{
    --bg:#0a0e0f; --panel:#111619; --panel2:#161c1f;
    --line:#232b2d; --line2:#313a3d;
    --txt:#e9eef0; --muted:#7c878b;
    --volt:#c9ff3a; --volt-deep:#a8e21a; --ink:#0a0f05;
    --accent:var(--volt); --accent2:var(--volt-deep); --blue:var(--volt);
    --red:#ff5454; --amber:#ffcf4d; --drop:#5bd0ff; --radius:4px;
    --mono:ui-monospace,'SF Mono','JetBrains Mono','Roboto Mono',Menlo,Consolas,monospace;
    --cond:'Barlow Condensed','Oswald',sans-serif;
    --disp:'Anton',Impact,sans-serif;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    background-color:var(--bg); color:var(--txt); font-size:16px;
    background-image:
      repeating-linear-gradient(45deg, rgba(255,255,255,.017) 0 1px, transparent 1px 8px),
      repeating-linear-gradient(-45deg, rgba(255,255,255,.017) 0 1px, transparent 1px 8px);
    background-attachment:fixed;
    padding-bottom:80px; line-height:1.4; overscroll-behavior-y:contain;
  }
  header{
    position:sticky; top:0; z-index:20;
    background:linear-gradient(180deg, rgba(10,14,15,.97), rgba(10,14,15,.80));
    backdrop-filter:blur(10px); border-bottom:1px solid var(--line);
    padding:16px 16px 13px 22px; display:flex; align-items:center; justify-content:space-between; gap:8px;
  }
  header::before{content:""; position:absolute; left:0; top:14px; bottom:12px; width:4px; background:var(--volt); box-shadow:0 0 10px rgba(201,255,58,.5)}
  header h1{font-family:var(--disp); font-size:26px; margin:0; font-weight:400; letter-spacing:2px; text-transform:uppercase; line-height:1}
  header h1 span{color:var(--volt)}
  .datebar{font-family:var(--mono); font-size:11px; color:var(--muted); margin-top:6px; text-transform:uppercase; letter-spacing:1.5px}
  .datebar::before{content:"\25AA "; color:var(--volt)}
  .hbtns{display:flex; gap:8px; align-items:center}
  .iconbtn{width:38px; height:38px; display:inline-flex; align-items:center; justify-content:center; background:transparent; color:var(--muted); border:1px solid var(--line2); border-radius:3px; cursor:pointer}
  .iconbtn:active{color:var(--volt); border-color:var(--volt)}
  #unitBtn{font-family:var(--mono); text-transform:uppercase; letter-spacing:1px; font-weight:700; color:var(--volt); border:1px solid var(--line2); background:transparent; border-radius:3px; padding:9px 11px; font-size:13px; cursor:pointer}
  #unitBtn::before{content:"["} #unitBtn::after{content:"]"}
  .main{padding:16px 14px 24px; max-width:640px; margin:0 auto}
  h2.section{font-family:var(--disp); font-size:15px; text-transform:uppercase; letter-spacing:2px; color:var(--txt); margin:24px 2px 12px; font-weight:400; display:flex; align-items:center; gap:10px}
  h2.section::before{content:""; width:14px; height:2px; background:var(--volt)}

  .card{position:relative; background:var(--panel); border:1px solid var(--line); border-radius:var(--radius); padding:15px 14px; margin-bottom:12px}
  .exhead{display:flex; align-items:flex-start; justify-content:space-between; gap:8px; margin-bottom:3px}
  .exname{font-family:var(--cond); font-size:21px; font-weight:700; letter-spacing:.5px; text-transform:uppercase; line-height:1.05}
  .exmeta{font-family:var(--mono); font-size:11px; color:var(--muted); margin-bottom:12px; text-transform:uppercase; letter-spacing:.6px}
  .exmeta .pr{color:var(--volt)}
  .muscle-tag{display:inline-block; font-family:var(--mono); font-size:10px; padding:2px 7px; border-radius:2px; background:rgba(201,255,58,.08); color:var(--volt); border:1px solid var(--line2); margin-left:8px; vertical-align:middle; text-transform:uppercase; letter-spacing:.5px; font-weight:700}
  .exactions{display:flex; gap:2px; flex:0 0 auto}
  .iconmini{width:30px; height:30px; display:inline-flex; align-items:center; justify-content:center; background:none; border:none; color:var(--muted); cursor:pointer; border-radius:3px}
  .iconmini:active{color:var(--volt)}
  .iconmini.del{color:var(--red)}

  table.sets{width:100%; border-collapse:collapse}
  table.sets th{font-family:var(--mono); font-size:10px; color:var(--muted); text-transform:uppercase; letter-spacing:1px; font-weight:600; text-align:center; padding:2px 4px 6px}
  table.sets td{padding:4px 3px; text-align:center}
  .setnum{width:44px; font-family:var(--mono); color:var(--volt); font-weight:700; font-size:14px; cursor:pointer; user-select:none}
  .setnum.warm{color:var(--amber)}
  .setnum.drop{color:var(--drop)}
  input.num{
    width:100%; max-width:78px; background:var(--panel2); border:1px solid var(--line2);
    color:var(--txt); font-family:var(--mono); font-size:17px; text-align:center; padding:9px 4px; border-radius:3px; font-weight:700;
  }
  input.num.rpe{max-width:52px; font-size:15px; color:var(--amber)}
  input.num:focus{outline:none; border-color:var(--volt); background:#10171a; box-shadow:0 0 0 2px rgba(201,255,58,.15)}
  .chk{
    width:36px; height:36px; border-radius:3px; border:1px solid var(--line2);
    background:var(--panel2); color:var(--muted); cursor:pointer; display:inline-flex; align-items:center; justify-content:center;
  }
  .chk.on{background:var(--volt); border-color:var(--volt); color:var(--ink); box-shadow:0 0 12px rgba(201,255,58,.35)}
  .rowdel{color:var(--red); background:none; border:none; cursor:pointer; padding:4px 6px; opacity:.65; display:inline-flex; align-items:center}
  .rowdel:active{opacity:1}
  .daynote{width:100%; margin-top:4px; background:var(--panel); border:1px solid var(--line); color:var(--txt); font-family:var(--mono); font-size:13px; padding:11px; border-radius:var(--radius); resize:vertical; min-height:46px}
  .daynote:focus{outline:none; border-color:var(--line2)}

  .btn{
    display:inline-flex; align-items:center; justify-content:center; gap:7px;
    border-radius:3px; padding:12px 15px; font-family:var(--cond); font-size:15px; font-weight:700; letter-spacing:1px; text-transform:uppercase;
    cursor:pointer; background:var(--panel2); color:var(--txt); border:1px solid var(--line2);
  }
  .btn:active{transform:scale(.98)}
  .btn.full{width:100%}
  .btn.blue,.btn.green{background:var(--volt); border-color:var(--volt); color:var(--ink)}
  .btn.blue{box-shadow:0 0 16px rgba(201,255,58,.22)}
  .btn.ghost{background:transparent; color:var(--muted)}
  .btn.danger{background:transparent; border-color:var(--red); color:var(--red)}
  .btn.sm{padding:8px 12px; font-size:13px}
  .btn-row{display:flex; gap:8px; margin-top:12px}

  nav.tabs{
    position:fixed; bottom:0; left:0; right:0; z-index:30; display:flex;
    background:rgba(12,17,18,.97); backdrop-filter:blur(12px); border-top:1px solid var(--line);
    padding:8px 6px calc(8px + env(safe-area-inset-bottom));
  }
  nav.tabs button{
    position:relative; flex:1; background:none; border:none; color:var(--muted); font-family:var(--mono); font-size:10px; font-weight:700; letter-spacing:1px; text-transform:uppercase;
    padding:10px 2px 4px; cursor:pointer; display:flex; flex-direction:column; align-items:center; gap:5px;
  }
  nav.tabs button .ic{width:22px; height:22px; line-height:1}
  nav.tabs button.active{color:var(--volt)}
  nav.tabs button.active::before{content:""; position:absolute; top:0; left:30%; right:30%; height:2px; background:var(--volt); box-shadow:0 0 8px rgba(201,255,58,.6)}

  svg.i{display:inline-block; vertical-align:middle; flex:0 0 auto}
  .empty{text-align:center; color:var(--muted); padding:44px 20px; font-family:var(--mono); font-size:12.5px; text-transform:uppercase; letter-spacing:1px; line-height:1.7}
  .empty .big{margin-bottom:14px; display:flex; justify-content:center}
  .empty .big svg{color:#2c3639; width:48px; height:48px}

  .daychips{display:flex; gap:7px; overflow-x:auto; padding:2px 0 8px; -webkit-overflow-scrolling:touch}
  .daychip{flex:0 0 auto; padding:8px 15px; border-radius:3px; background:var(--panel); border:1px solid var(--line2); color:var(--muted); font-family:var(--cond); font-size:14px; font-weight:700; letter-spacing:.5px; text-transform:uppercase; cursor:pointer; white-space:nowrap}
  .daychip.active{background:var(--volt); color:var(--ink); border-color:var(--volt)}
  .daychip.today::after{content:"\25AA"; color:var(--volt); margin-left:6px; font-size:9px; vertical-align:middle}
  .daychip.active.today::after{color:var(--ink)}

  .routine-item{display:flex; align-items:center; justify-content:space-between; gap:8px; padding:12px 4px; border-bottom:1px solid var(--line)}
  .routine-item:last-child{border-bottom:none}
  .ri-name{font-family:var(--cond); font-weight:700; font-size:17px; text-transform:uppercase; letter-spacing:.5px}
  .ri-meta{font-family:var(--mono); font-size:11px; color:var(--muted); text-transform:uppercase; letter-spacing:.5px; margin-top:2px}

  .hist-day{margin-bottom:12px}

  @media (prefers-reduced-motion: reduce){ .confetti{display:none} .promodal.show{animation:none} }

<script>
"use strict";
/* ============ ICONOS ============ */
const ICON = {

/* ============ DATOS ============ */
const KEY = "gymTracker_v1";
const DAYS = ["Domingo","Lunes","Martes","Miércoles","Jueves","Viernes","Sábado"];
const ABBR = ["Dom","Lun","Mar","Mié","Jue","Vie","Sáb"];
const MUSCLES = ["Pecho","Espalda","Piernas","Hombros","Bíceps","Tríceps","Core","Glúteo","Cardio","Otro"];

const DEFAULT = {
  exercises: [
    {id:"e1", name:"Press banca", muscle:"Pecho"},
    {id:"e2", name:"Sentadilla", muscle:"Piernas"},
    {id:"e3", name:"Peso muerto", muscle:"Espalda"},
    {id:"e4", name:"Press militar", muscle:"Hombros"},
    {id:"e5", name:"Dominadas", muscle:"Espalda"},
    {id:"e6", name:"Curl bíceps", muscle:"Bíceps"},
    {id:"e7", name:"Fondos", muscle:"Tríceps"},
    {id:"e8", name:"Remo con barra", muscle:"Espalda"},
    {id:"e9", name:"Zancadas", muscle:"Piernas"},
    {id:"e10", name:"Plancha", muscle:"Core"},
  ],
  routine: {0:[],1:[],2:[],3:[],4:[],5:[],6:[]},
  sessions: {},
  bodyweight: [],
  settings: {unit:"kg", restDefault:90, restEnabled:true, showRpe:false, barKg:20, barLb:45}
};

const PRESETS = {
  "PPL — Empuje / Jalón / Pierna (6 días)": {

    2:[["Dominadas","Espalda",4,8],["Remo con barra","Espalda",4,10],["Curl bíceps","Bíceps",3,12],["Face pull","Hombros",3,15]],
    3:[["Sentadilla","Piernas",4,8],["Peso muerto","Espalda",3,6],["Zancadas","Piernas",3,12],["Plancha","Core",3,1]],
    4:[["Press banca","Pecho",4,8],["Press militar","Hombros",3,10],["Fondos","Tríceps",3,10],["Extensión tríceps","Tríceps",3,12]],
    5:[["Dominadas","Espalda",4,8],["Remo con barra","Espalda",4,10],["Curl bíceps","Bíceps",3,12],["Face pull","Hombros",3,15]],
    6:[["Sentadilla","Piernas",4,8],["Peso muerto","Espalda",3,6],["Zancadas","Piernas",3,12],["Plancha","Core",3,1]],
    0:[]
  },
  "Fuerza 5x5 (Lun/Mié/Vie)": {
    1:[["Sentadilla","Piernas",5,5],["Press banca","Pecho",5,5],["Remo con barra","Espalda",5,5]],
    3:[["Sentadilla","Piernas",5,5],["Press militar","Hombros",5,5],["Peso muerto","Espalda",1,5]],
    5:[["Sentadilla","Piernas",5,5],["Press banca","Pecho",5,5],["Remo con barra","Espalda",5,5]],
    0:[],2:[],4:[],6:[]
  },
  "Full-body (Lun/Mié/Vie)": {
    1:[["Sentadilla","Piernas",3,8],["Press banca","Pecho",3,8],["Remo con barra","Espalda",3,8],["Press militar","Hombros",3,10],["Curl bíceps","Bíceps",2,12]],
    3:[["Sentadilla","Piernas",3,8],["Press banca","Pecho",3,8],["Remo con barra","Espalda",3,8],["Press militar","Hombros",3,10],["Curl bíceps","Bíceps",2,12]],
    5:[["Sentadilla","Piernas",3,8],["Press banca","Pecho",3,8],["Remo con barra","Espalda",3,8],["Press militar","Hombros",3,10],["Curl bíceps","Bíceps",2,12]],
    0:[],2:[],4:[],6:[]
  }
};

let DB = load();
let state = { tab:"hoy", routineDay:new Date().getDay(), progEx:null };
let restInt=null, restEnd=0, restTotal=0;

function load(){
  try{
    const raw = localStorage.getItem(KEY);
    if(!raw) return structuredClone(DEFAULT);
    const d = JSON.parse(raw);
    const out = Object.assign(structuredClone(DEFAULT), d);
    out.settings = Object.assign({}, DEFAULT.settings, d.settings||{});
    if(!Array.isArray(out.bodyweight)) out.bodyweight=[];
    return out;
  }catch(e){ return structuredClone(DEFAULT); }
}
function save(){ localStorage.setItem(KEY, JSON.stringify(DB)); }
function uid(){ return "x"+Date.now().toString(36)+Math.random().toString(36).slice(2,6); }

/* ============ UTILIDADES ============ */
function todayKey(d){ d=d||new Date(); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function fmtDateLong(d){ return d.toLocaleDateString("es-MX",{weekday:"long", day:"numeric", month:"long"}); }
function exById(id){ return DB.exercises.find(e=>e.id===id); }
const U = ()=>DB.settings.unit;
function vibrate(p){ if(navigator.vibrate) try{navigator.vibrate(p);}catch(e){} }
function num(v){ return parseFloat(v)||0; }
function est1rm(s){ const w=num(s.weight), r=parseInt(s.reps)||0; return w>0? w*(1+r/30):0; }
function escapeHtml(s){ return (s||"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }

function toast(msg, actionLabel, actionFn, dur){
  const t=document.getElementById("toast");
  t.innerHTML = escapeHtml(msg) + (actionLabel?` <button id="toastAct">${escapeHtml(actionLabel)}</button>`:"");
  t.classList.add("show");
  if(actionLabel){ document.getElementById("toastAct").onclick=()=>{ t.classList.remove("show"); clearTimeout(t._t); actionFn(); }; }
  clearTimeout(t._t); t._t=setTimeout(()=>t.classList.remove("show"), dur||1700);
}

/* ============ SESIÓN ============ */
function makeSets(exId, count, reps){
  const prev=lastPerformance(exId); const out=[];
  for(let i=0;i<count;i++){ const p=prev&&prev[i];
    out.push({reps:(p?p.reps:(reps||"")), weight:(p?p.weight:""), done:false, type:"work", rpe:""}); }
  return out;
}
function getTodaySession(seed){
  const k = todayKey();
  if(!DB.sessions[k]){
    DB.sessions[k] = { exercises:[], note:"" };
    if(seed){
      const day = new Date().getDay();
      (DB.routine[day]||[]).forEach(r=>{
        const ex = exById(r.exId); if(!ex) return;
        DB.sessions[k].exercises.push({exId:ex.id, name:ex.name, muscle:ex.muscle, sets:makeSets(ex.id, r.sets||3, r.reps||10)});
      });
    }
    save();
  }
  if(DB.sessions[k].note===undefined) DB.sessions[k].note="";
  return DB.sessions[k];
}
function lastPerformance(exId){
  const keys = Object.keys(DB.sessions).filter(k=>k<todayKey()).sort().reverse();
  for(const k of keys){
    const ex = DB.sessions[k].exercises.find(e=>e.exId===exId);
    if(ex){ const done = ex.sets.filter(s=>s.done && s.type!=="warm" && (s.weight!==""||s.reps!=="")); if(done.length) return done; }
  }
  return null;
}
function bestE1RM(exId, beforeKey){
  let best=0;
  Object.keys(DB.sessions).forEach(k=>{ if(beforeKey && k>=beforeKey) return;
    const ex=DB.sessions[k].exercises.find(x=>x.exId===exId); if(!ex) return;
    ex.sets.forEach(s=>{ if(s.done){ const e=est1rm(s); if(e>best) best=e; } });
  });
  return best;
}
function topE1RMToday(exId){
  const ex=getTodaySession().exercises.find(x=>x.exId===exId); if(!ex) return 0;
  let m=0; ex.sets.forEach(s=>{ if(s.done){ const e=est1rm(s); if(e>m)m=e; } }); return m;
}

/* ============ VISTA: HOY ============ */
function renderHoy(){
  const el=document.getElementById("view-hoy");
  const sess=getTodaySession(false);
  let html="";
  if(sess.exercises.length===0){
    const day=new Date().getDay();
    const hasRoutine=(DB.routine[day]||[]).length>0;
    html += `<div class="empty"><div class="big">${icon('dumbbell',46)}</div>
      <div>Sin ejercicios registrados hoy.</div>
      ${hasRoutine?`<div class="btn-row" style="justify-content:center;margin-top:16px"><button class="btn green" onclick="seedFromRoutine()">Cargar rutina · ${DAYS[day]}</button></div>`:""}
      <div class="btn-row" style="justify-content:center;margin-top:10px"><button class="btn blue" onclick="openAddExercise()">${icon('plus',16)} Agregar ejercicio</button></div></div>`;
    el.innerHTML=html; return;
  }
  let totalSets=0, doneSets=0, volume=0;
  sess.exercises.forEach(ex=>ex.sets.forEach(s=>{ totalSets++; if(s.done){ doneSets++; volume += num(s.weight)*(parseInt(s.reps)||0); } }));
  html+=`<div class="stat-row">
    <div class="stat"><div class="v">${doneSets}/${totalSets}</div><div class="l">Series</div></div>
    <div class="stat"><div class="v">${sess.exercises.length}</div><div class="l">Ejercicios</div></div>
    <div class="stat"><div class="v">${Math.round(volume)}</div><div class="l">Vol ${U()}</div></div></div>`;

  const rpe=DB.settings.showRpe;
  sess.exercises.forEach((ex,ei)=>{
    const prev=lastPerformance(ex.exId);
    const pr=bestE1RM(ex.exId, todayKey());
    let work=0;
    html+=`<div class="card"><div class="exhead">
      <div class="exname">${escapeHtml(ex.name)}<span class="muscle-tag">${ex.muscle||""}</span></div>
      <div class="exactions">
        <button class="iconmini" onclick="moveEx(${ei},-1)" title="Subir">${icon('up',18)}</button>
        <button class="iconmini" onclick="moveEx(${ei},1)" title="Bajar">${icon('down',18)}</button>
        <button class="iconmini" onclick="openPlateFromEx(${ei})" title="Discos">${icon('dumbbell',18)}</button>
        <button class="iconmini del" onclick="removeSessionEx(${ei})" title="Quitar">${icon('x',18)}</button>
      </div></div>
      <div class="exmeta">${prev?`Última: ${prev.map(s=>`${s.weight||0}×${s.reps||0}`).join("  ")}`:"Sin registro previo"}${pr?` <span class="pr">· PR ${Math.round(pr)}${U()}</span>`:""}</div>
      <table class="sets"><thead><tr><th></th><th>Peso ${U()}</th><th>Reps</th>${rpe?"<th>RPE</th>":""}<th></th><th></th></tr></thead><tbody>`;
    ex.sets.forEach((s,si)=>{
      const t=s.type||"work";
      let lbl; if(t==="warm") lbl="CAL"; else if(t==="drop") lbl="DROP"; else { work++; lbl=String(work).padStart(2,"0"); }
      html+=`<tr>
        <td class="setnum ${t}" onclick="cycleType(${ei},${si})" title="Toca: normal/calentamiento/dropset">${lbl}</td>
        <td><input class="num" type="number" inputmode="decimal" placeholder="—" value="${s.weight}" onchange="updateSet(${ei},${si},'weight',this.value)"></td>
        <td><input class="num" type="number" inputmode="numeric" placeholder="—" value="${s.reps}" onchange="updateSet(${ei},${si},'reps',this.value)"></td>
        ${rpe?`<td><input class="num rpe" type="number" inputmode="decimal" placeholder="—" value="${s.rpe||""}" onchange="updateSet(${ei},${si},'rpe',this.value)"></td>`:""}
        <td><button class="chk ${s.done?'on':''}" onclick="toggleDone(${ei},${si})">${icon('check',18)}</button></td>
        <td><button class="rowdel" onclick="removeSet(${ei},${si})">${icon('x',16)}</button></td>
      </tr>`;
    });
    html+=`</tbody></table><div class="btn-row"><button class="btn sm ghost full" onclick="addSet(${ei})">${icon('plus',15)} Serie</button></div></div>`;
  });
  html+=`<textarea class="daynote" placeholder="Notas del día…" onchange="setDayNote(this.value)">${escapeHtml(sess.note||"")}</textarea>`;
  html+=`<div class="btn-row"><button class="btn blue full" onclick="openAddExercise()">${icon('plus',16)} Agregar ejercicio</button></div>`;
  el.innerHTML=html;
}
function seedFromRoutine(){ const k=todayKey(); delete DB.sessions[k]; getTodaySession(true); save(); renderHoy(); toast("Rutina cargada"); }
function updateSet(ei,si,f,v){ getTodaySession().exercises[ei].sets[si][f]=v; save(); }
function setDayNote(v){ getTodaySession().note=v; save(); }
function cycleType(ei,si){ const s=getTodaySession().exercises[ei].sets[si]; const o=["work","warm","drop"]; s.type=o[(o.indexOf(s.type||"work")+1)%3]; save(); renderHoy(); }
function toggleDone(ei,si){
  const ex=getTodaySession().exercises[ei]; const s=ex.sets[si]; s.done=!s.done; save();
  if(s.done){
    vibrate(15);
    if(DB.settings.restEnabled && s.type!=="warm") startRest(DB.settings.restDefault);
    const e1=est1rm(s), before=bestE1RM(ex.exId, todayKey());
    if(e1>0 && s.type!=="warm" && e1>before && e1>=topE1RMToday(ex.exId)){ vibrate([25,40,25,40,90]); showPR(ex.name, s, Math.round(e1), Math.round(e1-before)); }
  }
  renderHoy();
}
function addSet(ei){ const ex=getTodaySession().exercises[ei]; const l=ex.sets[ex.sets.length-1]; ex.sets.push({reps:l?l.reps:"", weight:l?l.weight:"", done:false, type:"work", rpe:""}); save(); renderHoy(); }
function removeSet(ei,si){ const ex=getTodaySession().exercises[ei]; const r=ex.sets[si]; ex.sets.splice(si,1); save(); renderHoy(); toast("Serie eliminada","Deshacer",()=>{ ex.sets.splice(si,0,r); save(); renderHoy(); }); }
function removeSessionEx(ei){ const sess=getTodaySession(); const r=sess.exercises[ei]; sess.exercises.splice(ei,1); save(); renderHoy(); toast("Ejercicio quitado","Deshacer",()=>{ sess.exercises.splice(ei,0,r); save(); renderHoy(); }); }
function moveEx(ei,dir){ const a=getTodaySession().exercises; const j=ei+dir; if(j<0||j>=a.length) return; [a[ei],a[j]]=[a[j],a[ei]]; save(); renderHoy(); }

/* ============ AGREGAR / CREAR EJERCICIO ============ */
function openAddExercise(target){
  const list = DB.exercises.slice().sort((a,b)=>a.name.localeCompare(b.name));
  const rd = target?target.routineDay:null;
  const rows = list.map(e=>`<div class="exopt" onclick="pickExercise('${e.id}', ${rd===null?'null':rd})"><span>${escapeHtml(e.name)}</span><span class="muscle-tag">${e.muscle||""}</span></div>`).join("");
  openSheet(`<h3>Elegir ejercicio</h3><div class="field"><input id="exSearch" placeholder="Buscar…" oninput="filterExOpts(this.value)"></div>
    <div class="exlist" id="exOpts">${rows}</div>
    <div class="btn-row"><button class="btn green full" onclick="openNewExercise(${rd===null?'null':rd})">${icon('plus',16)} Crear ejercicio nuevo</button></div>`);
}
function filterExOpts(q){ q=q.toLowerCase(); document.querySelectorAll("#exOpts .exopt").forEach(o=>{ o.style.display=o.textContent.toLowerCase().includes(q)?"":"none"; }); }
function pickExercise(exId, routineDay){
  const ex=exById(exId);
  if(routineDay===null||routineDay===undefined){
    getTodaySession().exercises.push({exId:ex.id, name:ex.name, muscle:ex.muscle, sets:makeSets(ex.id,3,10)});
    save(); closeSheet(); renderHoy();
  }else{ DB.routine[routineDay].push({exId:ex.id, sets:3, reps:10}); save(); closeSheet(); renderRutina(); }
}
function openNewExercise(routineDay){
  openSheet(`<h3>Nuevo ejercicio</h3>
    <div class="field"><label>Nombre</label><input id="neName" placeholder="Ej. Press inclinado"></div>
    <div class="field"><label>Grupo muscular</label><select id="neMuscle">${MUSCLES.map(m=>`<option>${m}</option>`).join("")}</select></div>
    <div class="btn-row"><button class="btn ghost full" onclick="closeSheet()">Cancelar</button><button class="btn green full" onclick="createExercise(${routineDay===null?'null':routineDay})">Guardar</button></div>`);
  setTimeout(()=>document.getElementById("neName").focus(),100);
}
function createExercise(routineDay){
  const name=document.getElementById("neName").value.trim(); if(!name){ toast("Escribe un nombre"); return; }
  const ex={id:uid(), name, muscle:document.getElementById("neMuscle").value}; DB.exercises.push(ex); save();
  pickExercise(ex.id, routineDay);
}
function findOrCreateEx(name,muscle){ let e=DB.exercises.find(x=>x.name.toLowerCase()===name.toLowerCase()); if(!e){ e={id:uid(),name,muscle}; DB.exercises.push(e); } return e; }

/* ============ VISTA: RUTINA ============ */
function renderRutina(){
  const el=document.getElementById("view-rutina"); const today=new Date().getDay(); const d=state.routineDay;
  let html=`<div class="daychips">`;
  for(let i=1;i<=6;i++) html+=dayChip(i,today); html+=dayChip(0,today); html+=`</div>`;
  const items=DB.routine[d]||[];
  html+=`<h2 class="section">${DAYS[d]}</h2>`;
  if(items.length===0){ html+=`<div class="empty"><div class="big">${icon('clipboard',46)}</div><div>Descanso o sin ejercicios.</div></div>`; }
  else{
    html+=`<div class="card" style="padding:4px 14px">`;
    items.forEach((r,i)=>{ const ex=exById(r.exId); if(!ex) return;
      html+=`<div class="routine-item"><div><div class="ri-name">${escapeHtml(ex.name)}</div><div class="ri-meta">${r.sets} × ${r.reps} · ${ex.muscle||""}</div></div>
        <div style="display:flex;gap:0">
          <button class="iconmini" onclick="moveRoutine(${i},-1)">${icon('up',18)}</button>
          <button class="iconmini" onclick="moveRoutine(${i},1)">${icon('down',18)}</button>
          <button class="iconmini" onclick="editRoutineItem(${i})">${icon('pencil',16)}</button>
          <button class="iconmini del" onclick="removeRoutineItem(${i})">${icon('x',17)}</button>
        </div></div>`; });
    html+=`</div>`;
  }
  html+=`<div class="btn-row"><button class="btn blue full" onclick="openAddExercise({routineDay:${d}})">${icon('plus',16)} Agregar a ${DAYS[d]}</button></div>`;
  html+=`<div class="btn-row"><button class="btn ghost full sm" onclick="openCopyDay()">${icon('copy',15)} Copiar día</button><button class="btn ghost full sm" onclick="openPresets()">${icon('clipboard',15)} Plantillas</button></div>`;
  el.innerHTML=html;
}
function dayChip(i,today){ return `<div class="daychip ${state.routineDay===i?'active':''} ${i===today?'today':''}" onclick="setRoutineDay(${i})">${ABBR[i]}</div>`; }
function setRoutineDay(i){ state.routineDay=i; renderRutina(); }
function removeRoutineItem(i){ const r=DB.routine[state.routineDay][i]; DB.routine[state.routineDay].splice(i,1); save(); renderRutina(); toast("Eliminado","Deshacer",()=>{ DB.routine[state.routineDay].splice(i,0,r); save(); renderRutina(); }); }
function moveRoutine(i,dir){ const a=DB.routine[state.routineDay]; const j=i+dir; if(j<0||j>=a.length) return; [a[i],a[j]]=[a[j],a[i]]; save(); renderRutina(); }
function editRoutineItem(i){
  const r=DB.routine[state.routineDay][i]; const ex=exById(r.exId);
  openSheet(`<h3>${escapeHtml(ex.name)}</h3><div class="field two">
    <div><label>Series</label><input id="riSets" type="number" inputmode="numeric" value="${r.sets}"></div>
    <div><label>Reps</label><input id="riReps" type="number" inputmode="numeric" value="${r.reps}"></div></div>
    <div class="btn-row"><button class="btn ghost full" onclick="closeSheet()">Cancelar</button><button class="btn green full" onclick="saveRoutineItem(${i})">Guardar</button></div>`);
}
function saveRoutineItem(i){ const r=DB.routine[state.routineDay][i]; r.sets=parseInt(document.getElementById("riSets").value)||3; r.reps=parseInt(document.getElementById("riReps").value)||10; save(); closeSheet(); renderRutina(); }
function openCopyDay(){
  const from=state.routineDay;
  const opts=[1,2,3,4,5,6,0].filter(i=>i!==from).map(i=>`<div class="exopt" onclick="copyDay(${from},${i})"><span>${DAYS[i]}</span><span class="ri-meta">${(DB.routine[i]||[]).length} ej.</span></div>`).join("");
  openSheet(`<h3>Copiar ${DAYS[from]} a…</h3><div class="ri-meta" style="margin-bottom:10px">Reemplaza el día destino.</div><div class="exlist">${opts}</div>`);
}
function copyDay(from,to){ DB.routine[to]=structuredClone(DB.routine[from]); save(); closeSheet(); toast("Copiado a "+DAYS[to]); }
function openPresets(){
  const opts=Object.keys(PRESETS).map(n=>`<div class="exopt" onclick="applyPreset('${n.replace(/'/g,"\\'")}')"><span>${n}</span>${icon('plus',16)}</div>`).join("");
  openSheet(`<h3>Plantillas de rutina</h3><div class="ri-meta" style="margin-bottom:10px">Reemplaza toda tu semana.</div><div class="exlist">${opts}</div>`);
}
function applyPreset(name){
  const p=PRESETS[name]; if(!p) return;
  const nr={0:[],1:[],2:[],3:[],4:[],5:[],6:[]};
  Object.keys(p).forEach(day=>{ (p[day]||[]).forEach(a=>{ const ex=findOrCreateEx(a[0],a[1]); nr[day].push({exId:ex.id, sets:a[2], reps:a[3]}); }); });
  DB.routine=nr; save(); closeSheet(); renderRutina(); toast("Plantilla aplicada");
}

/* ============ VISTA: PROGRESO ============ */
function renderHist(){
  const el=document.getElementById("view-hist");
  const keys=Object.keys(DB.sessions).filter(k=>DB.sessions[k].exercises.some(e=>e.sets.some(st=>st.done))).sort().reverse();
  let html="";
  const total=keys.length;
  const now=new Date(); const wkStart=new Date(now); wkStart.setDate(now.getDate()-((now.getDay()+6)%7)); wkStart.setHours(0,0,0,0);
  const moStart=new Date(now.getFullYear(),now.getMonth(),1);
  const wk=keys.filter(k=>new Date(k+"T12:00:00")>=wkStart).length;
  const mo=keys.filter(k=>new Date(k+"T12:00:00")>=moStart).length;
  html+=`<div class="stat-row">
    <div class="stat"><div class="v">${total}</div><div class="l">Entrenos</div></div>
    <div class="stat"><div class="v">${wk}</div><div class="l">Semana</div></div>
    <div class="stat"><div class="v">${mo}</div><div class="l">Mes</div></div></div>`;
  html+=`<h2 class="section">Actividad</h2><div class="card">${heatmap()}</div>`;
  html+=`<h2 class="section">Fuerza · Big 3</h2>${big3Card()}`;

  html+=`<h2 class="section">Progreso</h2>`;
  const trained=[...new Set(keys.slice().reverse().flatMap(k=>DB.sessions[k].exercises.filter(e=>e.sets.some(s=>s.done)).map(e=>e.exId)))];
  if(trained.length===0){ html+=`<div class="empty" style="padding:20px"><div>Aún sin datos. Marca tus series como hechas.</div></div>`; }
  else{
    if(!state.progEx || !trained.includes(state.progEx)) state.progEx=trained[trained.length-1];
    html+=`<div class="field"><select id="progSel" onchange="state.progEx=this.value; renderHist()">${trained.map(id=>{const e=exById(id); return e?`<option value="${id}" ${state.progEx===id?'selected':''}>${escapeHtml(e.name)}</option>`:"";}).join("")}</select></div>`;
    html+=progressCard(state.progEx);
  }

  html+=`<h2 class="section">Peso corporal</h2>${bodyweightCard()}`;
  html+=`<h2 class="section">Volumen por músculo · 30 días</h2>${muscleDist()}`;

  html+=`<h2 class="section">Entrenamientos</h2>`;
  if(keys.length===0){ html+=`<div class="empty"><div class="big">${icon('chart',46)}</div><div>Sin entrenamientos aún.</div></div>`; }
  keys.forEach(k=>{
    const s=DB.sessions[k]; let inner="";
    s.exercises.forEach(ex=>{ const done=ex.sets.filter(st=>st.done); if(!done.length) return;
      inner+=`<div class="hist-ex"><b>${escapeHtml(ex.name)}</b> <span class="hist-sets">${done.map(st=>`${st.weight||0}×${st.reps||0}`).join("  ")}</span></div>`; });
    if(!inner) return;
    html+=`<div class="hist-day card"><div class="hist-date" style="display:flex;justify-content:space-between;align-items:center"><span>${fmtDateLong(new Date(k+"T12:00:00"))}</span><button class="iconmini" style="color:var(--muted)" onclick="openShareSession('${k}')">${icon("share",15)}</button></div>${inner}${s.note?`<div class="hist-note">“${escapeHtml(s.note)}”</div>`:""}</div>`;
  });
  el.innerHTML=html;
}

function sessionVolume(k){ let v=0; (DB.sessions[k]?DB.sessions[k].exercises:[]).forEach(e=>e.sets.forEach(s=>{ if(s.done) v+=num(s.weight)*(parseInt(s.reps)||0); })); return v; }
function heatmap(){
  const today=new Date(); today.setHours(0,0,0,0);
  const wkThisMon=(today.getDay()+6)%7;
  const weeks=18; let cells="";
  const start=new Date(today); start.setDate(today.getDate()-wkThisMon-(weeks-1)*7);
  for(let w=0; w<weeks; w++) for(let day=0; day<7; day++){
    const d=new Date(start); d.setDate(start.getDate()+w*7+day);
    if(d>today){ cells+=`<div class="hcell future"></div>`; continue; }
    const v=sessionVolume(todayKey(d));
    let lv=""; if(v>0) lv=v<1500?"l1":v<3500?"l2":v<6000?"l3":"l4";
    cells+=`<div class="hcell ${lv}" title="${todayKey(d)}"></div>`;
  }
  return `<div class="heat">${cells}</div>`;
}
function progressCard(exId){
  const ex=exById(exId); if(!ex) return "";
  const pts=[]; Object.keys(DB.sessions).sort().forEach(k=>{ const e=DB.sessions[k].exercises.find(x=>x.exId===exId); if(!e) return;
    let mw=0,b1=0; e.sets.forEach(s=>{ if(!s.done) return; const w=num(s.weight); if(w>mw)mw=w; const e1=est1rm(s); if(e1>b1)b1=e1; });
    if(mw>0||b1>0) pts.push({mw,e1:b1}); });
  if(!pts.length) return `<div class="card"><div class="ri-meta">Sin series completadas.</div></div>`;
  const mw=Math.max(...pts.map(p=>p.mw)), b1=Math.max(...pts.map(p=>p.e1));
  const delta=Math.round((pts[pts.length-1].mw-pts[0].mw)*100)/100;
  return `<div class="card"><div class="exname" style="font-size:17px;margin-bottom:2px">${escapeHtml(ex.name)}</div>
    <div class="stat-row">
      <div class="stat"><div class="v">${mw}${U()}</div><div class="l">Máx peso</div></div>
      <div class="stat"><div class="v">${Math.round(b1)}${U()}</div><div class="l">1RM est.</div></div>
      <div class="stat"><div class="v" style="color:${delta>=0?'var(--volt)':'var(--red)'}">${delta>=0?'+':''}${delta}</div><div class="l">Δ ${U()}</div></div></div>
    ${sparkline(pts.map(p=>p.mw))}<div class="ri-meta" style="text-align:center">${pts.length} sesiones</div></div>`;
}
function sparkline(vals){
  if(vals.length<2) return "";
  const W=300,H=46,pad=4; const mn=Math.min(...vals),mx=Math.max(...vals),rng=(mx-mn)||1;
  const step=(W-pad*2)/(vals.length-1);
  const p=vals.map((v,i)=>[pad+i*step, H-pad-((v-mn)/rng)*(H-pad*2)]);
  const d=p.map((q,i)=>(i?"L":"M")+q[0].toFixed(1)+" "+q[1].toFixed(1)).join(" ");
  const area=`M${p[0][0]} ${H} `+p.map(q=>"L"+q[0].toFixed(1)+" "+q[1].toFixed(1)).join(" ")+` L${p[p.length-1][0]} ${H} Z`;
  const last=p[p.length-1];
  return `<svg class="spark" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none"><path d="${area}" fill="rgba(201,255,58,.14)"/><path d="${d}" fill="none" stroke="var(--volt)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="${last[0].toFixed(1)}" cy="${last[1].toFixed(1)}" r="3" fill="var(--volt)"/></svg>`;
}

function openPlateFromEx(ei){ const ex=getTodaySession().exercises[ei]; let mw=0; ex.sets.forEach(s=>{ const w=num(s.weight); if(w>mw)mw=w; }); openPlateCalc(mw||""); }
function openPlateCalc(prefill){
  const bar=U()==="kg"?DB.settings.barKg:DB.settings.barLb;
  openSheet(`<h3>Calculadora de discos</h3>
    <div class="field two"><div><label>Objetivo (${U()})</label><input id="pcTarget" type="number" inputmode="decimal" value="${prefill||""}" oninput="calcPlates()"></div>
    <div><label>Barra (${U()})</label><input id="pcBar" type="number" inputmode="decimal" value="${bar}" oninput="calcPlates()"></div></div>
    <div id="pcVis" class="plate-vis"></div><div id="pcTxt" class="plate-txt"></div>`);
  setTimeout(calcPlates,30);
}
function calcPlates(){
  const target=num(document.getElementById("pcTarget").value);
  const bar=num(document.getElementById("pcBar").value);
  DB.settings[U()==="kg"?"barKg":"barLb"]=bar; save();
  const vis=document.getElementById("pcVis"), txt=document.getElementById("pcTxt");
  const plates=U()==="kg"?[25,20,15,10,5,2.5,1.25]:[45,35,25,10,5,2.5];
  const perSide=(target-bar)/2;
  if(target<=0){ vis.innerHTML=""; txt.innerHTML="Ingresa un peso objetivo."; return; }
  if(perSide<0){ vis.innerHTML=""; txt.innerHTML="El objetivo es menor que la barra."; return; }
  let rem=perSide, used=[];
  plates.forEach(p=>{ while(rem>=p-1e-9){ used.push(p); rem=Math.round((rem-p)*100)/100; } });
  const soloBar=`<div class="bbell"><div class="collar"></div><div class="sleeve"></div><div class="shaft"></div><div class="sleeve"></div><div class="collar"></div></div>`;
  vis.innerHTML = used.length? loadedBarHTML(used) : soloBar;
  const totalLoaded=Math.round((bar+(perSide-rem)*2)*100)/100;
  txt.innerHTML = `<b>${used.length?used.join(" + "):"solo barra"}</b> por lado · total <b>${totalLoaded}${U()}</b>${rem>0.01?` · faltan ${Math.round(rem*200)/100}`:""}`;
}
function plateInfo(p){
  const kg={25:["#e23b46","#fff",82],20:["#2f6bff","#fff",82],15:["#f5c518","#141414",70],10:["#22a447","#fff",58],5:["#eef1f2","#141414",46],2.5:["#d63b3b","#fff",36],1.25:["#b9c1c5","#141414",28]};
  const lb={45:["#2f6bff","#fff",82],35:["#f5c518","#141414",72],25:["#22a447","#fff",60],10:["#eef1f2","#141414",46],5:["#e23b46","#fff",38],2.5:["#b9c1c5","#141414",30]};
  return (U()==="kg"?kg:lb)[p]||["#b9c1c5","#141414",34];
}
function loadedBarHTML(used){
  const cell=p=>{const i=plateInfo(p);return `<div class="pl" style="background:${i[0]};color:${i[1]};height:${i[2]}px">${p}</div>`;};
  const right=used.map(cell).join("");
  const left=used.slice().reverse().map(cell).join("");
  return `<div class="bbell"><div class="collar"></div>${left}<div class="sleeve"></div><div class="shaft"></div><div class="sleeve"></div>${right}<div class="collar"></div></div>`;
}

/* ============ BIG 3 / FUERZA / PLATE CLUBS ============ */
const BIG3=[
  {label:"Sentadilla", re:/sentad|squat/i, thr:[1.0,1.25,1.75,2.5]},
  {label:"Press banca", re:/banca|bench/i, thr:[0.75,1.0,1.5,2.0]},
  {label:"Peso muerto", re:/peso *muerto|deadlift|dead/i, thr:[1.0,1.5,2.0,2.75]}
];
const LVL=["Principiante","Novato","Intermedio","Avanzado","Élite"];
function strengthLevel(ratio,thr){ if(!ratio) return null; let i=0; while(i<thr.length && ratio>=thr[i]) i++; return i; }
function bigLift(re){ let e1=0,w=0; DB.exercises.filter(e=>re.test(e.name)).forEach(e=>{ Object.keys(DB.sessions).forEach(k=>{ const ex=DB.sessions[k].exercises.find(x=>x.exId===e.id); if(!ex)return; ex.sets.forEach(s=>{ if(!s.done||s.type==="warm")return; const a=est1rm(s); if(a>e1)e1=a; const ww=num(s.weight); if(ww>w)w=ww; }); }); }); return {e1,w}; }
function plateClub(weight){ return U()==="kg"? Math.max(0,Math.floor((weight-20)/40+1e-9)) : Math.max(0,Math.floor((weight-45)/90+1e-9)); }
function curBW(){ if(!DB.bodyweight.length) return 0; return DB.bodyweight.slice().sort((a,b)=>a.date<b.date?-1:1).pop().weight; }
function platesFor(weight){ const bar=U()==="kg"?DB.settings.barKg:DB.settings.barLb; const plates=U()==="kg"?[25,20,15,10,5,2.5,1.25]:[45,35,25,10,5,2.5]; let rem=(weight-bar)/2, used=[]; if(rem<0)return[]; plates.forEach(pp=>{ while(rem>=pp-1e-9){ used.push(pp); rem=Math.round((rem-pp)*100)/100; } }); return used; }

function big3Card(){
  const bw=curBW();
  const lifts=BIG3.map(b=>({b, d:bigLift(b.re)}));
  if(!lifts.some(x=>x.d.e1>0)) return `<div class="card"><div class="ri-meta">Registra sentadilla, press banca y peso muerto para ver tu total y tu nivel de fuerza.</div></div>`;
  const total=Math.round(lifts.reduce((s,x)=>s+x.d.e1,0));
  const rows=lifts.map(x=>{
    const lvl=bw?strengthLevel(x.d.e1/bw,x.b.thr):null;
    const club=plateClub(x.d.w);
    return `<div class="b3row"><span class="b3name">${x.b.label}</span>
      <span class="b3meta">${club>=1?`<span class="club">${club}${icon("dumbbell",12)}</span>`:""}${lvl!=null?`<span class="b3lvl">${LVL[lvl]}</span>`:""}</span>
      <span class="b3w">${x.d.e1?Math.round(x.d.e1):"—"}<small>${U()}</small></span></div>`;
  }).join("");
  const tlvl=bw?strengthLevel(total/bw,[2.75,3.75,5.25,7.25]):null;
  const maxClub=Math.max(...lifts.map(x=>plateClub(x.d.w)),0);
  return `<div class="card">
    ${maxClub>=1?`<div class="clubbadge">${icon("dumbbell",18)} ${maxClub} Plate Club</div>`:""}
    ${rows}
    <div class="b3total"><span class="b3tl">Total 1RM est.</span><b>${total}<small>${U()}</small></b>${tlvl!=null?`<span class="b3lvl big">${LVL[tlvl]}</span>`:""}</div>
    ${bw?"":`<div class="ri-meta" style="margin-top:8px">Registra tu peso corporal para calcular tu nivel.</div>`}
    <div class="btn-row"><button class="btn blue full sm" onclick="openShareSheet('big3',big3ShareData())">${icon("share",14)} Compartir Big 3</button></div>
  </div>`;
}
function big3ShareData(){
  const bw=curBW(); const lifts=BIG3.map(b=>({label:b.label, d:bigLift(b.re), thr:b.thr}));
  const total=Math.round(lifts.reduce((s,x)=>s+x.d.e1,0));
  const tlvl=bw?strengthLevel(total/bw,[2.75,3.75,5.25,7.25]):null;
  return {kind:"big3", lifts:lifts.map(x=>({label:x.label, val:Math.round(x.d.e1), lvl:bw&&x.d.e1?LVL[strengthLevel(x.d.e1/bw,x.thr)]:""})), total, level:tlvl!=null?LVL[tlvl]:"", shareText:`Mi Big 3: ${total}${U()} total. #GymTracker`};
}

function drawBarbellCanvas(ctx,cx,cy,used){
  const pw=42,gap=6,sleeveW=30,collarW=18,shaftW=120;
  ctx.fillStyle="#9aa4a9"; ctx.fillRect(cx-shaftW/2, cy-8, shaftW, 16);
  [1,-1].forEach(dir=>{
    let x=cx+dir*shaftW/2;
    ctx.fillStyle="#7f888d"; ctx.fillRect(dir>0?x:x-sleeveW, cy-14, sleeveW, 28); x+=dir*sleeveW;
    used.forEach(pp=>{ const info=plateInfo(pp); const hh=info[2]*2.2; const px=dir>0?x:x-pw;
      ctx.fillStyle=info[0]; ctx.fillRect(px, cy-hh/2, pw, hh);
      ctx.strokeStyle="rgba(0,0,0,.5)"; ctx.lineWidth=2; ctx.strokeRect(px, cy-hh/2, pw, hh);
      ctx.fillStyle=info[1]; ctx.font="700 18px 'Barlow Condensed', sans-serif"; ctx.textAlign="center"; ctx.textBaseline="middle"; ctx.fillText(String(pp), px+pw/2, cy);
      x+=dir*(pw+gap); });
    ctx.fillStyle="#7f888d"; ctx.fillRect(dir>0?x:x-collarW, cy-22, collarW, 44);
  });
  ctx.textAlign="left"; ctx.textBaseline="alphabetic";
}
function drawCard(ctx,W,H,kind,data){
  ctx.fillStyle="#0a0e0f"; ctx.fillRect(0,0,W,H);
  ctx.strokeStyle="rgba(255,255,255,0.022)"; ctx.lineWidth=2;
  for(let i=-H;i<W;i+=30){ ctx.beginPath(); ctx.moveTo(i,0); ctx.lineTo(i+H,H); ctx.stroke(); ctx.beginPath(); ctx.moveTo(i,H); ctx.lineTo(i+H,0); ctx.stroke(); }
  ctx.fillStyle="#c9ff3a"; ctx.fillRect(0,0,18,H);
  ctx.textBaseline="alphabetic"; ctx.textAlign="left";
  ctx.font="400 52px 'Anton', sans-serif"; ctx.fillStyle="#e9eef0"; ctx.fillText("GYM",72,122);
  const gw=ctx.measureText("GYM").width; ctx.fillStyle="#c9ff3a"; ctx.fillText("TRACKER",72+gw+4,122);
  ctx.font="400 22px 'Barlow Condensed', sans-serif"; ctx.fillStyle="#7c878b"; ctx.textAlign="right";
  ctx.fillText((new Date()).toLocaleDateString("es-MX",{day:"numeric",month:"long",year:"numeric"}).toUpperCase(), W-60, 118);
  ctx.textAlign="center";
  if(kind==="pr"){
    ctx.font="400 32px 'Barlow Condensed', sans-serif"; ctx.fillStyle="#c9ff3a"; ctx.fillText("NUEVO RÉCORD", W/2, 340);
    ctx.font="700 78px 'Barlow Condensed', sans-serif"; ctx.fillStyle="#e9eef0"; ctx.fillText(data.name.toUpperCase(), W/2, 436);
    ctx.font="400 240px 'Anton', sans-serif"; ctx.fillStyle="#c9ff3a"; ctx.fillText(String(data.weight), W/2, 720);
    ctx.font="400 58px 'Anton', sans-serif"; ctx.fillStyle="#7c878b"; ctx.fillText(U().toUpperCase(), W/2, 792);
    ctx.font="400 34px 'Barlow Condensed', sans-serif"; ctx.fillStyle="#b9c1c5";
    ctx.fillText(`${data.reps} REPS  ·  1RM EST. ${data.e1}${U().toUpperCase()}${data.gain>0?`  ·  +${data.gain}${U().toUpperCase()}`:""}`, W/2, 866);
    drawBarbellCanvas(ctx, W/2, 1090, platesFor(data.weight));
  } else if(kind==="big3"){
    ctx.textAlign="left"; ctx.font="400 32px 'Barlow Condensed', sans-serif"; ctx.fillStyle="#c9ff3a"; ctx.fillText("BIG 3 · FUERZA",72,300);
    let y=430;
    data.lifts.forEach(l=>{
      ctx.textAlign="left"; ctx.font="700 48px 'Barlow Condensed', sans-serif"; ctx.fillStyle="#e9eef0"; ctx.fillText(l.label.toUpperCase(),72,y);
      if(l.lvl){ ctx.font="400 22px 'Barlow Condensed', sans-serif"; ctx.fillStyle="#7c878b"; ctx.fillText(l.lvl.toUpperCase(),72,y+34); }
      ctx.textAlign="right"; ctx.font="400 60px 'Anton', sans-serif"; ctx.fillStyle="#c9ff3a"; ctx.fillText((l.val||"—")+U(), W-72, y+6);
      y+=150;
    });
    ctx.strokeStyle="#232b2d"; ctx.lineWidth=2; ctx.beginPath(); ctx.moveTo(72,y-74); ctx.lineTo(W-72,y-74); ctx.stroke();
    ctx.textAlign="center"; ctx.font="400 34px 'Barlow Condensed', sans-serif"; ctx.fillStyle="#7c878b"; ctx.fillText("TOTAL 1RM ESTIMADO", W/2, y+10);
    ctx.font="400 210px 'Anton', sans-serif"; ctx.fillStyle="#c9ff3a"; ctx.fillText(String(data.total), W/2, y+230);
    ctx.font="400 52px 'Anton', sans-serif"; ctx.fillStyle="#7c878b"; ctx.fillText(U().toUpperCase(), W/2, y+296);
    if(data.level){ ctx.font="700 42px 'Barlow Condensed', sans-serif"; const tw=ctx.measureText(data.level.toUpperCase()).width;
      ctx.fillStyle="#c9ff3a"; ctx.fillRect(W/2-tw/2-26, y+340, tw+52, 66);
      ctx.fillStyle="#0a0e0f"; ctx.fillText(data.level.toUpperCase(), W/2, y+385); }
  } else if(kind==="session"){
    ctx.textAlign="left"; ctx.font="400 32px 'Barlow Condensed', sans-serif"; ctx.fillStyle="#c9ff3a"; ctx.fillText(data.date.toUpperCase(),72,300);
    let y=410;
    data.rows.slice(0,7).forEach(r=>{
      ctx.textAlign="left"; ctx.font="700 44px 'Barlow Condensed', sans-serif"; ctx.fillStyle="#e9eef0"; ctx.fillText(r.name.toUpperCase(),72,y);
      ctx.textAlign="right"; ctx.font="400 30px monospace"; ctx.fillStyle="#7c878b"; ctx.fillText(r.sets, W-72, y);
      y+=90;
    });
    ctx.textAlign="left"; ctx.font="400 34px 'Barlow Condensed', sans-serif"; ctx.fillStyle="#7c878b"; ctx.fillText("VOLUMEN TOTAL",72,H-230);
    ctx.font="400 150px 'Anton', sans-serif"; ctx.fillStyle="#c9ff3a"; ctx.fillText(String(data.volume),72,H-92);
    ctx.font="400 42px 'Anton', sans-serif"; ctx.fillStyle="#7c878b"; ctx.fillText(U().toUpperCase(),72+ctx.measureText(String(data.volume)).width+16,H-92);
  }
  ctx.textAlign="center"; ctx.font="400 24px 'Barlow Condensed', sans-serif"; ctx.fillStyle="#4b5457";
  ctx.fillText("GYMTRACKER · REGISTRA. SUPERA. REPITE.", W/2, H-42);
  ctx.textAlign="left";
}

/* ============ SHEET / NAV ============ */
function openSheet(html){ document.getElementById("sheet").innerHTML=html; document.getElementById("overlay").classList.add("show"); }
function closeSheet(){ document.getElementById("overlay").classList.remove("show"); }
document.getElementById("overlay").addEventListener("click",e=>{ if(e.target.id==="overlay") closeSheet(); });
document.getElementById("settingsBtn").innerHTML=icon('gear',20);
document.getElementById("settingsBtn").addEventListener("click",openSettings);

function refresh(){ if(state.tab==="hoy") renderHoy(); else if(state.tab==="rutina") renderRutina(); else renderHist(); }
function switchTab(tab){
  state.tab=tab;
  document.querySelectorAll("nav.tabs button").forEach(b=>b.classList.toggle("active",b.dataset.tab===tab));
  document.getElementById("view-hoy").classList.toggle("hidden",tab!=="hoy");
  document.getElementById("view-rutina").classList.toggle("hidden",tab!=="rutina");
  document.getElementById("view-hist").classList.toggle("hidden",tab!=="hist");
  refresh();
}
document.querySelectorAll("nav.tabs button").forEach(b=>b.addEventListener("click",()=>switchTab(b.dataset.tab)));
document.getElementById("unitBtn").addEventListener("click",()=>{ DB.settings.unit=U()==="kg"?"lb":"kg"; save(); document.getElementById("unitBtn").textContent=U(); refresh(); });

/* ============ INIT ============ */
function init(){
  document.getElementById("datebar").textContent=fmtDateLong(new Date());
  document.getElementById("unitBtn").textContent=U();
  renderHoy();
  if("serviceWorker" in navigator){ navigator.serviceWorker.register("sw.js").catch(()=>{}); }
}
init();
</script>
